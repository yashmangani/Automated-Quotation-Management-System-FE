<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Document Card -->
  <g filter="url(#shadow)">
    <rect x="136" y="96" width="240" height="316" rx="22" fill="#ffffff" stroke="#ffffff" stroke-width="2" />
    <path d="M 136 118 Q 136 96 158 96 L 354 96 Q 376 96 376 118 L 376 166 L 136 166 Z" fill="#ef4444" />
    <text x="256" y="145" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">“ ”</text>

    <!-- Document Lines -->
    <rect x="170" y="195" width="120" height="14" rx="7" fill="#dc2626" />
    <rect x="306" y="195" width="36" height="14" rx="7" fill="#94a3b8" />

    <rect x="170" y="225" width="80" height="12" rx="6" fill="#cbd5e1" />
    <rect x="290" y="225" width="52" height="12" rx="6" fill="#cbd5e1" />

    <rect x="170" y="250" width="100" height="12" rx="6" fill="#cbd5e1" />
    <rect x="290" y="250" width="52" height="12" rx="6" fill="#cbd5e1" />

    <line x1="170" y1="280" x2="342" y2="280" stroke="#e2e8f0" stroke-width="2" />
    
    <rect x="170" y="295" width="60" height="15" rx="7" fill="#64748b" />
    <rect x="280" y="295" width="62" height="15" rx="7" fill="#dc2626" />
  </g>

  <!-- Automation Lightning Badge -->
  <g filter="url(#shadow)">
    <circle cx="356" cy="356" r="46" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4" />
    <polygon points="360,330 342,358 354,358 350,382 370,354 358,354" fill="#ffffff" />
  </g>
</svg>
